<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#ffffff"/>
  <style>
    text { font-family: Aptos, Arial, sans-serif; fill: #151a20; }
    .title { font-size: 31px; font-weight: 700; }
    .sub { font-size: 17px; fill: #66717d; }
    .section { font-size: 20px; font-weight: 700; }
    .head { font-size: 15px; font-weight: 700; fill: #66717d; }
    .row { font-size: 17px; }
    .value { font-size: 17px; font-weight: 700; }
    .small { font-size: 14px; fill: #66717d; }
  </style>

  <text class="title" x="28" y="39">Static references produce inconsistent benchmark effects</text>
  <text class="sub" x="28" y="67">Sensitivity test: replace every model-specific gas term with the 15-model median</text>

  <text class="section" x="34" y="116">Downstream MAE</text>
  <text class="head" x="34" y="149">BENCHMARK</text>
  <text class="head" x="330" y="149">OWN REF.</text>
  <text class="head" x="445" y="149">STATIC</text>
  <text class="head" x="555" y="149">CHANGE</text>
  <line x1="34" y1="160" x2="655" y2="160" stroke="#cfd7dc" stroke-width="1.5"/>

  <g>
    <rect x="28" y="170" width="635" height="58" fill="#f7f9fa"/>
    <text class="row" x="40" y="205">O_Ads_1</text>
    <text class="row" x="330" y="205">0.877 eV</text>
    <text class="row" x="445" y="205">0.864 eV</text>
    <text class="value" x="555" y="205" fill="#007f78">−1.5%</text>

    <text class="row" x="40" y="263">O_OH_Trendline</text>
    <text class="row" x="330" y="263">0.841 eV</text>
    <text class="row" x="445" y="263">0.871 eV</text>
    <text class="value" x="555" y="263" fill="#b5463d">+3.5%</text>

    <rect x="28" y="286" width="635" height="58" fill="#fff0ed"/>
    <text class="row" x="40" y="321">CO_H_Ads: CO rows</text>
    <text class="row" x="330" y="321">0.173 eV</text>
    <text class="row" x="445" y="321">0.344 eV</text>
    <text class="value" x="555" y="321" fill="#b5463d">+99.1%</text>

    <text class="row" x="40" y="379">H₂O_ads</text>
    <text class="row" x="330" y="379">0.509 eV</text>
    <text class="row" x="445" y="379">0.477 eV</text>
    <text class="value" x="555" y="379" fill="#007f78">−6.2%</text>

    <rect x="28" y="402" width="635" height="58" fill="#f7f9fa"/>
    <text class="row" x="40" y="437">OVFE_Benchmark</text>
    <text class="row" x="330" y="437">1.244 eV</text>
    <text class="row" x="445" y="437">1.197 eV</text>
    <text class="value" x="555" y="437" fill="#007f78">−3.8%</text>
  </g>

  <text class="small" x="34" y="493">Negative change means the static median lowered MAE.</text>
  <text class="small" x="34" y="516">The mean static reference gives the same qualitative result.</text>

  <line x1="700" y1="92" x2="700" y2="554" stroke="#dfe5e9" stroke-width="2"/>
  <text class="section" x="740" y="116">Checkpoint-level effects</text>

  <text x="740" y="165" font-size="18" font-weight="700">MACE-mh1-matpes, CO</text>
  <text x="740" y="197" font-size="23" font-weight="800">0.054</text>
  <text x="814" y="197" font-size="16" fill="#66717d">own</text>
  <line x1="865" y1="189" x2="950" y2="189" stroke="#d65c52" stroke-width="4"/>
  <text x="969" y="197" font-size="23" font-weight="800" fill="#b5463d">1.740 eV</text>

  <text x="740" y="250" font-size="18" font-weight="700">CHGNet, O*/OH*</text>
  <text x="740" y="282" font-size="23" font-weight="800">0.525</text>
  <text x="814" y="282" font-size="16" fill="#66717d">own</text>
  <line x1="865" y1="274" x2="950" y2="274" stroke="#d65c52" stroke-width="4"/>
  <text x="969" y="282" font-size="23" font-weight="800" fill="#b5463d">0.958 eV</text>

  <text x="740" y="335" font-size="18" font-weight="700">UMA-oc22, O*/OH*</text>
  <text x="740" y="367" font-size="23" font-weight="800">1.525</text>
  <text x="814" y="367" font-size="16" fill="#66717d">own</text>
  <line x1="865" y1="359" x2="950" y2="359" stroke="#009b93" stroke-width="4"/>
  <text x="969" y="367" font-size="23" font-weight="800" fill="#007f78">0.704 eV</text>

  <text x="740" y="420" font-size="18" font-weight="700">UMA-oc22, H₂O*</text>
  <text x="740" y="452" font-size="23" font-weight="800">1.021</text>
  <text x="814" y="452" font-size="16" fill="#66717d">own</text>
  <line x1="865" y1="444" x2="950" y2="444" stroke="#009b93" stroke-width="4"/>
  <text x="969" y="452" font-size="23" font-weight="800" fill="#007f78">0.364 eV</text>

  <rect x="740" y="492" width="420" height="76" rx="8" fill="#f3f6f7"/>
  <text x="762" y="522" font-size="17" font-weight="700">Why the direction changes</text>
  <text x="762" y="550" font-size="15" fill="#53616b">A shared value removes one offset and imports another.</text>

  <rect x="28" y="600" width="1132" height="54" rx="8" fill="#e5f7f5"/>
  <text x="594" y="634" text-anchor="middle" font-size="20" font-weight="800" fill="#007f78">Keep model-specific references for production. Use static values for sensitivity tests.</text>
</svg>
